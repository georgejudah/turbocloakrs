[package]
name = "cloakrs"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
description = "Sub-millisecond PII redaction, secret scanning, and prompt-injection detection for AI agents."
repository = "https://github.com/georgejudah/turbocloakrs"
readme = "README.md"
keywords = ["pii", "privacy", "security", "llm", "redaction"]
categories = ["development-tools", "text-processing"]

[lib]
name = "_cloakrs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28.3", features = ["extension-module", "abi3-py38"] }
regex = "1.13"
once_cell = "1.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
